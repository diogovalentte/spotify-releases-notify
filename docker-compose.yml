services:
  spotify-releases-notify:
    container_name: spotify-releases-notify
    image: ghcr.io/diogovalentte/spotify-releases-notify:latest
    environment:
      # Spotify
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - REDIRECT_URI=${REDIRECT_URI}
      # Ntfy
      - NTFY_TOKEN=${NTFY_TOKEN}
      - NTFY_TOPIC=${NTFY_TOPIC}
      - NTFY_URL=${NTFY_URL}
      # Database encryption
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # Redis
      - REDIS_URL=redis://spotify-releases-notify-redis:6379
    volumes:
      - ./config:/config
    ports:
      - 8000:8000
    restart: unless-stopped

  spotify-releases-notify-redis:
    container_name: spotify-releases-notify-redis
    image: redis:7-alpine
    volumes:
      - ./data:/data
    # ports:
    #   - 6379:6379
    restart: unless-stopped
